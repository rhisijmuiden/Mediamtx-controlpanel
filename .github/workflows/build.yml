name: Build

# Every push and pull request: build the panel, run the tests and check the translations.
# Every push to main: also start the panel with MediaMTX, take fresh screenshots for the README
# (docs/screenshots) and commit them when they changed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  MEDIAMTX_VERSION: "1.21.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet publish src/MediaMtxPanel/MediaMtxPanel.csproj -c Release -o publish -p:SourceRevisionId=${{ github.sha }}
      - name: Test
        run: dotnet test MediaMtxPanel.slnx
      - name: Check translations
        run: python3 tools/check-translations.py
      - uses: actions/upload-artifact@v4
        with:
          name: panel
          path: publish
          retention-days: 3

  screenshots:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: panel
          path: publish
      - name: Start MediaMTX and the panel
        run: tools/screenshots/start-demo.sh publish
      - name: Take screenshots
        working-directory: tools/screenshots
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node take-screenshots.mjs
      - name: Commit new screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
